name: Publish Docker images

# Builds and pushes the v2 worker image to Docker Hub on every published
# GitHub release. The Dockerfile lives at worker-image/Dockerfile and uses
# the build context rooted at the repo so it can COPY the package in.
#
# Python matrix: 3.11 and 3.12. Cloudpickle is not cross-minor, so users
# must run a client whose Python minor version matches the image they
# point their session at.

on:
    release:
        types: ["published"]
    workflow_dispatch:

jobs:
  docker:
    strategy:
      matrix:
        python_version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: worker-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: "PYTHON_VERSION=${{ matrix.python_version }}"
          tags: |
            dockerhubaneo/harmonic_snake:python-${{ matrix.python_version }}-${{ github.ref_name }}
            dockerhubaneo/harmonic_snake:python-${{ matrix.python_version }}
