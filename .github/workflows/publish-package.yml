name: "Publish PymoniK package to PyPI"

# Builds and publishes the pymonik package on every published GitHub
# release. The repo is now flat (pyproject.toml at root, src/ layout),
# so no working-directory hop is needed.

on:
  release:
    types: ["published"]

jobs:
  run:
    name: "Build and publish release"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        # Match the requires-python = "==3.11.*" floor in pyproject.toml.
        # Cloudpickle is not cross-minor, so the published wheel pins to
        # 3.11; a future release matrix can publish 3.12 separately.
        run: uv python install 3.11

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish -t ${{ secrets.PYPI_TOKEN }}
