[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
description = "Python framework for writing distributed programs that run on an ArmoniK cluster."
name = "pymonik"
version = "1.0.0a0"
readme = "README.md"
requires-python = "==3.11.*" # must match the worker image python
dependencies = [
    "armonik>=3.25.0",
    "anyio>=4.3",
    "cloudpickle>=3.1",
    "msgspec>=0.19",
    "grpcio>=1.60",
    "structlog>=24.1",
    "pyyaml>=6.0.3",
    "click>=8.1",
    # ``opentelemetry-instrumentation`` (pulled by the [otel] extra)
    # imports ``pkg_resources`` at module load. setuptools >= 81
    # dropped it. Pinning here (not in the [otel] extra) ensures
    # ``uv sync`` without ``--extra otel`` doesn't pull a newer
    # setuptools that would break the otel install path. Drop when
    # opentelemetry-instrumentation migrates to importlib.metadata.
    "setuptools<81",
    "rich-click>=1.9.7",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    # gRPC client instrumentation auto-injects W3C traceparent into
    # outgoing gRPC metadata; lets ArmoniK.Core's AspNetCore middleware
    # chain its server-side spans into our trace.
    "opentelemetry-instrumentation-grpc>=0.48b0",
]
# Optional Marimo integration. Pulls anywidget for the
# custom components and marimo itself for the running_in_notebook
# detection and mo.ui.anywidget wrapper. The core library imports
# nothing from these — installation is purely opt-in.
marimo = ["marimo>=0.10", "anywidget>=0.9", "polars>=1.40.1", "plotly>=6.7.0"]
mcp = ["mcp"]

[project.scripts]
pymonik-worker = "pymonik.worker:run"
pymonik = "pymonik.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pymonik"]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    # anyio ships its own pytest plugin; no separate pytest-anyio package.
    "trio>=0.27",
    "types-pyyaml>=6.0.12.20260408",
    # examples/ scripts that exercise the runtime-deps path import these at
    # module level so cloudpickle ships the function with proper module refs.
    "numpy>=2",
    "polars>=1",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-grpc>=0.48b0",
    "ty>=0.0.43",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that take more than a few seconds (e.g. real `uv` env builds)",
]

# Python 3.13 cap rationale:
# `armonik` transitively pulls `grpcio-tools==1.62.3`, whose sdist uses the
# removed `pkg_resources` stdlib module and fails to build on 3.13. The cap
# lifts once upstream bumps grpcio-tools (or drops it entirely from runtime
# deps). Tracked in ../IMPLEMENTATION_PLAN.md §7.
