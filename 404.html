<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PymoniK Documentation</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://pymonik.readthedocs.io/en/latest/">
  <script>
    (function () {
      var base = "https://pymonik.readthedocs.io/en/latest/";
      // Strip the GitHub Pages project prefix (/PymoniK/).
      var path = window.location.pathname.replace(/^\/PymoniK\//, "");
      // Old mkdocs URLs were directory-style (/guides/custom-worker/);
      // readthedocs (Sphinx) serves flat pages (guides/custom-worker.html).
      path = path.replace(/index\.html$/, "").replace(/\/+$/, "");
      if (path && !/\.html$/.test(path)) {
        path += ".html";
      }
      window.location.replace(base + path + window.location.hash);
    })();
  </script>
</head>
<body>
  <p>The documentation has moved to
     <a href="https://pymonik.readthedocs.io/en/latest/">pymonik.readthedocs.io</a>.</p>
</body>
</html>
